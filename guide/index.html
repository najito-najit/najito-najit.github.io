:root{--bg:#F7ECD5;--card:#FFF9EC;--ink:#46280F;--muted:#7A5B3C;--orange:#E8751A;--line:#E6D5AE}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Yu Gothic UI","Hiragino Sans",-apple-system,"Segoe UI",sans-serif;line-height:1.7}

.nav a.now{color:var(--orange)}
.hero{display:flex;align-items:center;gap:8px;padding:2px 0 10px}
.hero img{width:84px;height:auto;flex:none}
.say{position:relative;background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:10px 14px;flex:1}
.say:before{content:"";position:absolute;left:-8px;top:36px;width:14px;height:14px;background:var(--card);border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg)}
.say b{display:block;font-size:19px;line-height:1.3}
.say span{display:block;font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.5}
h2{font-size:16px;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
h2:before{content:"";width:7px;height:20px;border-radius:4px;background:var(--orange)}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;margin:0 0 10px;text-decoration:none;color:var(--ink)}
.item:hover{border-color:var(--orange)}
.item img{width:64px;height:64px;border-radius:14px;flex:none}
.item h3{margin:0 0 2px;font-size:15px;line-height:1.45}
.item p{margin:2px 0;font-size:12.5px;color:var(--muted);line-height:1.55}
.item .meta{font-size:11.5px}
.tag{display:inline-block;font-size:11px;font-weight:800;color:var(--orange);border:1.2px solid var(--orange);border-radius:999px;padding:0 8px;margin-right:6px}
.btn{display:inline-block;background:transparent;color:var(--ink);border:1.5px solid var(--ink);text-decoration:none;font-weight:800;font-size:12px;padding:3px 12px;border-radius:999px;margin:12px 4px 0 0}
footer{border-top:1.5px solid var(--line);margin-top:22px;padding:12px 0 24px;font-size:12px;color:var(--muted);text-align:center}
footer a{color:var(--muted);margin:0 6px}
